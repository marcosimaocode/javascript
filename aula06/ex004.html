<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        body {
            background-color: antiquewhite;
            color: rgb(46, 46, 46);
            font: normal 20pt Arial;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt('Qual é o teu nome?')                      /* posso colocar tags de html dentro do script, como demonstrado */
        document.write(`Olá, ${nome}.Seu nome tem ${nome.length} letras. <br/>`)
        document.write(`O seu nome em maiúsculas é ${nome.toUpperCase()}`)
    </script>
    
</body>
</html>
