<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro </title>
    <style>
        body {
            background-color: plum;
            color: white;
            font: normal 20pt Arial;
        }
        h1 {
            color: yellow;
        }
    </style>
</head>
<body>
    <h1>Olá mundo</h1>
    <p>Já adbhasjdbasjkdb</p>

    <script>
       var n1 = Number.parseFloat(window.prompt('Digite um número')) // por defeito o comando prompt, torna a resposta em string
       var n2 = Number(window.prompt('Digite outro número'))
       var soma = n1 + n2

       //(number + number) para adição
       //(string + string) para concatenação

       window.alert(`A soma de ${n1} e ${n2} é igual a ${soma}`)
    </script>

    
</body>
</html>
